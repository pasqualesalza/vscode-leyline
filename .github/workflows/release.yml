name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Validate release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Validate tag format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match format vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # Extract version from tag and package.json
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          # Validate tag matches package.json
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Detect pre-release
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # VS Code Marketplace convention: odd minor = pre-release, even minor = stable
          MINOR=$(echo "$TAG" | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
          if (( MINOR % 2 == 1 )); then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "vsce_flag=--pre-release" >> "$GITHUB_OUTPUT"
            echo "Pre-release detected (odd minor: $MINOR)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "vsce_flag=" >> "$GITHUB_OUTPUT"
            echo "Stable release detected (even minor: $MINOR)"
          fi

      - run: bun run check-types
      - run: bun run compile
      - run: bun run lint
      - run: bun run test
      - run: xvfb-run -a bun run test:e2e

      - name: Extract release notes
        id: release-notes
        uses: ffurrer2/extract-release-notes@v3

      - name: Package VSIX
        run: bunx @vscode/vsce package --no-dependencies ${{ steps.meta.outputs.vsce_flag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release-notes.outputs.release_notes }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: bunx @vscode/vsce publish --no-dependencies ${{ steps.meta.outputs.vsce_flag }} --packagePath *.vsix
