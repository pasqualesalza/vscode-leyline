<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    Theme-aware Leyline triangle — transparent background.
    Uses VS Code CSS variables so it adapts to dark/light/high-contrast themes.
    Used in: contributes.walkthroughs icon field.
  -->
  <line x1="128" y1="40" x2="48" y2="208" stroke="var(--vscode-foreground)" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="40" x2="208" y2="208" stroke="var(--vscode-foreground)" stroke-width="8" stroke-linecap="round"/>
  <line x1="48" y1="208" x2="208" y2="208" stroke="var(--vscode-foreground)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="128" cy="150" r="16" fill="var(--vscode-foreground)"/>
  <circle cx="48" cy="208" r="20" fill="var(--vscode-foreground)"/>
  <circle cx="208" cy="208" r="20" fill="var(--vscode-foreground)"/>
</svg>
